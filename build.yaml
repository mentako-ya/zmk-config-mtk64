# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # 1. Direct PC Connection (BLE Central on Right)
  - board: xiao_ble//zmk
    shield: mtk64_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mtk64_R
  - board: xiao_ble//zmk
    shield: mtk64_L rgbled_adapter
    artifact-name: mtk64_L
  - board: xiao_ble//zmk
    shield: mtk64_FOOT rgbled_adapter
    artifact-name: mtk64_FOOT

  # 2. Dongle Connection (Central on Dongle)
  - board: xiao_ble//zmk
    shield: mtk64_DONGLE rgbled_adapter dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mtk64_DONGLE_display
  - board: xiao_ble//zmk
    shield: mtk64_DONGLE rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mtk64_DONGLE
  - board: xiao_ble//zmk
    shield: mtk64_R rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: mtk64_R_dongle

  # 3. Left-ball / Right-encoder Variation
  - board: xiao_ble//zmk
    shield: mtk64_leftball_L rgbled_adapter
    artifact-name: mtk64_L_leftball
  - board: xiao_ble//zmk
    shield: mtk64_leftball_R rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: mtk64_R_leftball

  # 4. Settings Reset
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
