# ==============================================================================
# mtk64ebt 直接PC接続 (BLE Split) ファームウェア ビルドマトリクス (build.yaml)
# ==============================================================================
---
include:
  # 右手 Central（フットスイッチなし: 接続枠=1）
  - board: xiao_ble//zmk
    shield: mtk64_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
    artifact-name: mtk64_R

  # 右手 Central（フットスイッチあり: 接続枠=2）
  - board: xiao_ble//zmk
    shield: mtk64_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
    artifact-name: mtk64_R_foot

  # 左手 Peripheral (エンコーダー＋キーマトリクス)
  - board: xiao_ble//zmk
    shield: mtk64_L rgbled_adapter
    artifact-name: mtk64_L

  # フットスイッチ Peripheral
  - board: xiao_ble//zmk
    shield: mtk64_FOOT rgbled_adapter
    artifact-name: mtk64_FOOT

  # 左ボール構成 右手 Central（フットスイッチなし: 接続枠=1）
  - board: xiao_ble//zmk
    shield: mtk64_leftball_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
    artifact-name: mtk64_R_leftball

  # 左ボール構成 右手 Central（フットスイッチあり: 接続枠=2）
  - board: xiao_ble//zmk
    shield: mtk64_leftball_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
    artifact-name: mtk64_R_foot_leftball

  # 左ボール構成 左手 Peripheral (トラックボール＋キーマトリクス)
  - board: xiao_ble//zmk
    shield: mtk64_leftball_L rgbled_adapter
    artifact-name: mtk64_L_leftball

  # 設定リセット (ペアリング・NVS消去用)
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
