CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=1

# BLE connection parameters tuning (Force 133Hz / 7.5ms interval & No Latency)
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_ZMK_SPLIT_BLE_PREF_INT=16

# Trackball Report Intervals (Microseconds)
# USB: 1000us (1000Hz), BLE: 7000us (7.0ms スロット直前ガード / 133.3Hz)
CONFIG_ZMK_TRACKBALL_REPORT_INTERVAL_USB_US=1000
CONFIG_ZMK_TRACKBALL_REPORT_INTERVAL_BLE_US=7000

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PINCTRL=y

# ---------------------------------------------------------------------------
# PAW32xx Driver & NVS Persistence
# ---------------------------------------------------------------------------
CONFIG_SETTINGS=y
# ---------------------------------------------------------------------------

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# battery level percentage
CONFIG_RGBLED_WIDGET=y 
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50    
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=20 

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7
