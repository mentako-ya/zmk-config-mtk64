CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_MOUSE=y

# 通信方式（BLE Central / ESB Peripheral）は build.yaml の cmake-args で動的に切り替えます


CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=4
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PINCTRL=y

# Input subsystem queue and thread optimizations for high-rate trackball (badjeff reference)
CONFIG_INPUT_THREAD_STACK_SIZE=8192
CONFIG_INPUT_QUEUE_MAX_MSGS=512
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=4

# Disable USB logging for maximum 1000Hz polling performance
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y

# ---------------------------------------------------------------------------
# PAW32xx Driver & NVS Persistence
# ---------------------------------------------------------------------------
CONFIG_SETTINGS=y
# ---------------------------------------------------------------------------

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30

# battery level percentage
CONFIG_RGBLED_WIDGET=y 
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50    
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=20 

# Indicate highest active layer with a constant configurable color per layer
#| Color        | Value |
#| ------------ | ----- |
#| Black (none) | `0`   |
#| Red          | `1`   |
#| Green        | `2`   |
#| Yellow       | `3`   |
#| Blue         | `4`   |
#| Magenta      | `5`   |
#| Cyan         | `6`   |
#| White        | `7`   |
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7

# BLE connection parameters tuning (Optimized for 133Hz Direct PC connection)
CONFIG_ZMK_KEYBOARD_NAME="mtk64"
CONFIG_BT_DEVICE_NAME="mtk64"
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=2
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# --- Bluetoothトラブルシューティング（通常は設定不要） ---
# 古いPC等で接続が途切れる場合: 2Mbps通信を無効化して互換性向上
# CONFIG_BT_CTLR_PHY_2M=n
# 会社管理PC等でペアリング時のキーコード（パスキー）認証が必須な場合
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y


