on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Create release zips
        run: |
          cd firmware

          # ====================================================================
          # パッケージング処理: 各利用シーンに応じた ZIP アーカイブを作成
          # ====================================================================

          # --------------------------------------------------------------------
          # パッケージ 1: 直接PC接続 (右手 Central + 左手 Peripheral)
          # 【役割・構成】
          # - ドングルを使用せず、右手（mtk64_R）をBLE CentralとしてPCと直接接続する標準構成。
          # - 右手 (mtk64_R.uf2): BLE Central (PCとBLE/USB接続、左手とBLE Split接続、ZMK Studio対応)
          # - 左手 (mtk64_L.uf2): BLE Peripheral (右手へBLE Split送信)
          # - 初期化用 (settings_reset.uf2): BLEペアリング不調時のリセット用
          # --------------------------------------------------------------------
          if [ -f "mtk64_R.uf2" ] && [ -f "mtk64_L.uf2" ]; then
            zip -q "../mtk64ebt_Right_Left.zip" mtk64_R.uf2 mtk64_L.uf2 settings_reset.uf2 2>/dev/null || true
          fi

          # --------------------------------------------------------------------
          # パッケージ 2: 直接PC接続 + フットスイッチ (右手 Central + 左手/フット Peripheral)
          # 【役割・構成】
          # - パッケージ 1 にフットスイッチ（mtk64_FOOT.uf2）を追加した直接接続構成。
          # - 右手 (mtk64_R.uf2): BLE Central（接続枠=2 で左手＋フットの同時接続に対応）
          # - 左手 (mtk64_L.uf2): BLE Peripheral (右手へBLE Split送信)
          # - フット (mtk64_FOOT.uf2): BLE Peripheral (右手へBLE Split送信)
          # --------------------------------------------------------------------
          if [ -f "mtk64_R_foot.uf2" ] && [ -f "mtk64_L.uf2" ] && [ -f "mtk64_FOOT.uf2" ]; then
            mkdir -p pkg_foot
            cp mtk64_R_foot.uf2 pkg_foot/mtk64_R.uf2
            cp mtk64_L.uf2 pkg_foot/
            cp mtk64_FOOT.uf2 pkg_foot/
            cp settings_reset.uf2 pkg_foot/ 2>/dev/null || true
            (cd pkg_foot && zip -q "../../mtk64ebt_Right_Left_Foot.zip" *.uf2)
            rm -rf pkg_foot
          fi

          # --------------------------------------------------------------------
          # --------------------------------------------------------------------
          # パッケージ 3: 直接PC接続 左ボール構成 (right_left_leftball)
          # 【役割・構成】
          # - 左手トラックボール、右手エンコーダーの直接PC接続構成。
          # - 左手 (mtk64_L_leftball.uf2): BLE Central (トラックボール、PCとBLE/USB接続、ZMK Studio対応)
          # - 右手 (mtk64_R_leftball.uf2): BLE Peripheral (エンコーダー、左手へBLE Split送信)
          # - 初期化用 (settings_reset.uf2): BLEペアリング不調時のリセット用
          # --------------------------------------------------------------------
          if [ -f "mtk64_R_leftball.uf2" ] && [ -f "mtk64_L_leftball.uf2" ]; then
            zip -q "../mtk64ebt_Right_Left_leftball.zip" mtk64_R_leftball.uf2 mtk64_L_leftball.uf2 settings_reset.uf2 2>/dev/null || true
          fi

          # --------------------------------------------------------------------
          # パッケージ 4: 直接PC接続 左ボール + フットスイッチ (right_left_foot_leftball)
          # 【役割・構成】
          # - パッケージ 3 にフットスイッチ（mtk64_FOOT.uf2）を追加した直接接続構成。
          # - 左手 (mtk64_L_foot_leftball.uf2): BLE Central（接続枠=2 で右手＋フットの同時接続に対応）
          # - 右手 (mtk64_R_leftball.uf2): BLE Peripheral (エンコーダー、左手へBLE Split送信)
          # - フット (mtk64_FOOT.uf2): BLE Peripheral (左手へBLE Split送信)
          # --------------------------------------------------------------------
          L_FOOT_LB=""
          if [ -f "mtk64_L_foot_leftball.uf2" ]; then
            L_FOOT_LB="mtk64_L_foot_leftball.uf2"
          elif [ -f "mtk64_L_leftball_foot.uf2" ]; then
            L_FOOT_LB="mtk64_L_leftball_foot.uf2"
          fi

          if [ -n "$L_FOOT_LB" ] && [ -f "mtk64_R_leftball.uf2" ] && [ -f "mtk64_FOOT.uf2" ]; then
            mkdir -p pkg_foot_leftball
            cp "$L_FOOT_LB" pkg_foot_leftball/mtk64_L_leftball.uf2
            cp mtk64_R_leftball.uf2 pkg_foot_leftball/
            cp mtk64_FOOT.uf2 pkg_foot_leftball/
            cp settings_reset.uf2 pkg_foot_leftball/ 2>/dev/null || true
            (cd pkg_foot_leftball && zip -q "../../mtk64ebt_Right_Left_Foot_leftball.zip" *.uf2)
            rm -rf pkg_foot_leftball
          fi

          cd ..
          
          echo "TAG_NAME=latest-rev4" >> $GITHUB_ENV

      - name: Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          allowUpdates: true
          removeArtifacts: false
          artifacts: "*.zip"
          body: "Automated pre-built firmware packages for mtk64ebt (Direct Bluetooth PC connection on right_left_rev4)"
          name: "Latest Direct Connection Firmware (mtk64ebt right_left_rev4)"
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to mtk64ebt repository
        env:
          PAT_TOKEN: ${{ secrets.MTK64EBT_PUSH_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::warning::MTK64EBT_PUSH_TOKEN is not configured. Skipping push to mtk64ebt repository."
            exit 0
          fi
          
          git clone https://x-access-token:${PAT_TOKEN}@github.com/mentako-ya/mtk64ebt.git mtk64ebt-repo
          mkdir -p mtk64ebt-repo/firmware/rev4
          cp *.zip mtk64ebt-repo/firmware/rev4/
          
          cd mtk64ebt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/rev4/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update Rev4 Direct Connection firmware ZIPs from zmk-config-mtk64@${{ github.sha }}"
            git push origin main
          else
            echo "No changes in firmware ZIP. Skipping push."
          fi


